[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vocal-to-score-mcp"
version = "0.1.0"
description = "Local, process-isolated vocal separation and singing transcription tools"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["mcp==2.3.0", "mido==1.3.3", "lxml>=5.3,<7", "textgrid==1.6.1"]

[project.scripts]
vocal-to-score-mcp = "vocal_to_score_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
