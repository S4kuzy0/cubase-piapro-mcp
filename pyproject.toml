[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cubase-piapro-mcp"
version = "0.5.0"
description = "Local data-first MCP for Cubase and Piapro Studio"
requires-python = ">=3.12"
dependencies = ["mcp==2.3.0", "lxml>=5.3,<7", "mido==1.3.3", "python-rtmidi>=1.5,<2", "construct==2.10.70", "construct-typing==0.8.1", "pywin32>=308,<313; sys_platform == 'win32'"]

[project.scripts]
cubase-piapro-mcp = "cubase_piapro_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cubase_piapro_mcp = ["_vendor/**/*.txt", "_vendor/**/*.json", "assets/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
